name: Deployment

on:
  workflow_dispatch:

jobs:
  deployment:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release --project xUnitMessages.Tests/xUnitMessages.Tests.csproj
    - name: Archive nuget-package artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: |
          ${{ github.workspace }}/xUnitMessages/bin/Release/*.nupkg
          ${{ github.workspace }}/xUnitMessages/bin/Release/*.snupkg
    - name: Resolve package version
      id: pkg
      run: |
        set -euo pipefail
        nupkg=$(ls "${{ github.workspace }}"/xUnitMessages/bin/Release/Xunit.v3.AssertMessages.*.nupkg)
        version=$(basename "$nupkg" .nupkg)
        version=${version#Xunit.v3.AssertMessages.}
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Resolved package version $version"
    - name: Verify the version is not already published
      run: |
        set -euo pipefail
        version='${{ steps.pkg.outputs.version }}'
        if curl -sf https://api.nuget.org/v3-flatcontainer/xunit.v3.assertmessages/index.json \
             | jq -e --arg v "$version" '.versions | index($v)' > /dev/null; then
          echo "::error::$version is already on nuget.org - nothing would be published, so no tag is created."
          exit 1
        fi
        echo "$version has not been published yet"
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      run: dotnet nuget push ${{ github.workspace }}/xUnitMessages/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

    - name: Tag the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version='${{ steps.pkg.outputs.version }}'
        gh release create "v$version" \
          --target "${{ github.sha }}" \
          --title "v$version" \
          --generate-notes
