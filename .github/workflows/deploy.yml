name: Deployment

on:
  workflow_dispatch:

jobs:
  deployment:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release --project xUnitMessages.Tests/xUnitMessages.Tests.csproj
    - name: Archive nuget-package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: |
          ${{ github.workspace }}/xUnitMessages/bin/Release/*.nupkg
          ${{ github.workspace }}/xUnitMessages/bin/Release/*.snupkg
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      run: dotnet nuget push ${{ github.workspace }}/xUnitMessages/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
