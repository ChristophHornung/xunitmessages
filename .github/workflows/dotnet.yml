name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release --project xUnitMessages.Tests/xUnitMessages.Tests.csproj
    - name: Archive nuget-package artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: ${{ github.workspace }}/xUnitMessages/bin/Release/*.nupkg
